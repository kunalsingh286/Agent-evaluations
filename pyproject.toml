[project]
name = "langchain-agent-evaluation-system"
version = "0.1.0"
description = "A comprehensive evaluation framework for LangChain AI agents using DeepEval (7 metrics across trace and output)"
readme = "README.md"
authors = [
    { name = "Kunal Singh" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncio>=4.0.0",
    "deepeval[inspect]>=4.2.8",
    "langchain>=1.4.4",
    "langchain-openai>=1.7.0",
    "portalocker[win32]>=4.4.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
